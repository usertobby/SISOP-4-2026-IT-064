[global]
    workgroup = WORKGROUP
    server string = LibraryIT Server
    netbios name = libraryit-server
    security = user
    map to guest = Never
    encrypt passwords = yes
    smb ports = 445

    # Logging ke file custom
    log file = /var/log/samba/libraryit.log
    log level = 1
    max log size = 10240

    # Format log custom: [YYYY-MM-DD HH:MM:SS] [LEVEL] [USERNAME] [AKSI] [NAMA FILE/SHARE]
    # Samba log diproses oleh logger service
    full_audit:prefix = %I|%u
    full_audit:success = connect disconnect opendir mkdir rmdir open read write rename unlink
    full_audit:failure = connect opendir mkdir open read write rename unlink
    full_audit:facility = local7
    full_audit:priority = notice

    # Samba tidak bisa sembunyikan share secara dinamis, sehingga handle di share level
    # "browseable = no" untuk sourcecode agar tidak tampil

[ebooks]
    path = /data/ebooks
    browseable = yes
    read only = no
    # staff bisa write, readonly hanya baca
    write list = @staff
    valid users = @staff @readonly
    create mask = 0664
    directory mask = 0775
    vfs objects = full_audit
    full_audit:prefix = %u
    full_audit:success = connect disconnect open read write rename unlink mkdir rmdir
    full_audit:failure = connect open read write rename unlink mkdir rmdir

[papers]
    path = /data/papers
    browseable = yes
    read only = no
    write list = @staff
    valid users = @staff @readonly
    create mask = 0664
    directory mask = 0775
    vfs objects = full_audit
    full_audit:prefix = %u
    full_audit:success = connect disconnect open read write rename unlink mkdir rmdir
    full_audit:failure = connect open read write rename unlink mkdir rmdir

[sourcecode]
    path = /data/sourcecode
    # Tidak terlihat saat browsing share list
    browseable = no
    read only = no
    # Tidak ada user yang valid = tidak bisa diakses sama sekali
    valid users =
    vfs objects = full_audit
    full_audit:prefix = %u
    full_audit:success = connect disconnect open read write rename unlink mkdir rmdir
    full_audit:failure = connect open read write rename unlink mkdir rmdir

[docs]
    path = /data/docs
    browseable = yes
    # Semua bisa baca, hanya librarian yang bisa tulis
    read only = yes
    write list = librarian
    valid users = @staff @readonly
    create mask = 0644
    directory mask = 0755
    vfs objects = full_audit
    full_audit:prefix = %u
    full_audit:success = connect disconnect open read write rename unlink mkdir rmdir
    full_audit:failure = connect open read write rename unlink mkdir rmdir